name: Test

on:
  push:
    branches:
      - main
  pull_request: ~

jobs:
  test:
    name: Test
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gember_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GEMBER_MYSQL_DSN: pdo-mysql://root:root@127.0.0.1:3306/gember_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test
